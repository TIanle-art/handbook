# main 守卫：检查进入 main 的提交是否来自已批准的 PR
# 免费计划的私有仓库没有分支保护，这是事后检查，失败时由技术负责人核查
# 只有一名维护者、作者不能批准自己的 PR 时，带 review-waived 标签的 PR 会放行并输出警告。
# 谁可以加标签、什么情况可以加，见《团队协作开发规范》11.7；要换标签名可以传 with: waiver-label
name: main-guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    uses: TIanle-art/ci-workflows/.github/workflows/main-guard.yml@v1
