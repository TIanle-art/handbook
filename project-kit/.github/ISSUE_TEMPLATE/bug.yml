name: 缺陷
description: 报告不符合预期的行为
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: 版本和环境
      placeholder: 例如 v1.2.0，生产环境，Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附上日志、截图或 request_id，不要包含敏感数据
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options: ["S0 致命", "S1 严重", "S2 一般", "S3 轻微"]
    validations:
      required: true
